<a href="{% url 'inbox' %}"
   class="relative w-11 h-11 rounded-full hidden sm:flex items-center justify-center text-gray-200 bg-[#4a5a4b]/50 hover:bg-[#5a6a5b]/50 hover:text-white border border-[#5a6a5b]/50 transition-colors focus-visible:outline-2 focus-visible:outline-gold-400 focus-visible:outline-offset-2"
   aria-label="Inbox{% if unread_messages %}, {{ unread_messages }} unread{% endif %}">
    <i class="bi bi-envelope-fill"></i>
    {% if unread_messages %}
        <span class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-gold-400 text-pine-600 text-[11px] font-bold flex items-center justify-center tabular-nums ring-2 ring-pine-800" aria-hidden="true">{% if unread_messages > 99 %}99+{% else %}{{ unread_messages }}{% endif %}</span>
    {% endif %}
</a>
