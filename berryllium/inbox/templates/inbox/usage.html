<div class="rounded-2xl border border-pine-300 bg-pine-600 px-4 py-3">
    <div class="flex items-baseline justify-between gap-2 text-xs">
        <span class="font-semibold uppercase tracking-wider text-gray-400">Inbox space</span>
        <span class="tabular-nums {% if usage.full %}text-red-300{% elif usage.nearly_full %}text-gold-200{% else %}text-gray-300{% endif %}">{{ usage.used }} / {{ usage.limit }}</span>
    </div>
    <div class="mt-2 h-1.5 rounded-full bg-pine-800 overflow-hidden" role="progressbar" aria-label="Inbox space used" aria-valuemin="0" aria-valuemax="{{ usage.limit }}" aria-valuenow="{{ usage.used }}">
        <div class="h-full rounded-full {% if usage.full %}bg-red-400{% else %}bg-gold-400{% endif %}" style="width: {{ usage.percent }}%"></div>
    </div>
    {% if usage.full %}
        <p class="mt-2 text-xs text-red-200">Your inbox is full. Delete conversations you don't need to send or receive messages.</p>
    {% elif usage.nearly_full %}
        <p class="mt-2 text-xs text-gold-200">Your inbox is nearly full.</p>
    {% endif %}
</div>
