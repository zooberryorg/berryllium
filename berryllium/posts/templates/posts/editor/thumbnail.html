<section id="thumbnail" class="rounded-2xl border border-pine-300 bg-pine-600 p-5 scroll-mt-24">
    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Thumbnail <span class="text-red-500">*</span></h2>
    <p class="text-xs text-white/50 mt-1 mb-3">One image for cards and the top of the article. At least 640px wide, 16:9 works best. Put other images in the article itself.</p>

    <input type="file" id="thumbnail-input" name="image" accept=".jpg,.jpeg,.png,.webp" class="sr-only"
           hx-post="{% url 'post_thumbnail' post.pk %}"
           hx-encoding="multipart/form-data"
           hx-trigger="change"
           hx-target="#thumbnail"
           hx-swap="outerHTML"
           hx-indicator="#thumbnail-busy">

    {% if post.thumbnail %}
        <div class="relative overflow-hidden rounded-xl aspect-video bg-pine-800">
            <img src="{{ post.thumbnail.url }}" alt="" class="w-full h-full object-cover">
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-2" x-data="{ confirming: false }">
            <label for="thumbnail-input" class="zb-action inline-flex items-center justify-center gap-1.5 text-sm cursor-pointer" x-show="!confirming"><i class="bi bi-arrow-repeat"></i> Replace</label>
            <button type="button" class="zb-action inline-flex items-center justify-center gap-1.5 text-sm" x-show="!confirming" @click="confirming = true"><i class="bi bi-trash"></i> Remove</button>
            <span class="text-sm text-gray-200" x-show="confirming" x-cloak>Remove the thumbnail?</span>
            <button type="button" class="zb-action inline-flex items-center justify-center gap-1.5 text-sm" x-show="confirming" x-cloak
                    hx-post="{% url 'post_thumbnail' post.pk %}"
                    hx-vals='{"action": "remove"}'
                    hx-target="#thumbnail"
                    hx-swap="outerHTML"><i class="bi bi-trash"></i> Remove</button>
            <button type="button" class="zb-action inline-flex items-center justify-center gap-1.5 text-sm" x-show="confirming" x-cloak @click="confirming = false">Keep it</button>
        </div>
    {% else %}
        <label for="thumbnail-input"
               class="flex flex-col items-center justify-center gap-2 aspect-video rounded-xl border-2 border-dashed border-white/15 bg-pine-800/40 text-white/50 hover:border-gold-400/50 hover:text-gold-200 cursor-pointer transition-colors">
            <i class="bi bi-image text-3xl"></i>
            <span class="text-sm">Choose an image</span>
        </label>
    {% endif %}
    <p id="thumbnail-busy" class="htmx-indicator text-xs text-white/50 mt-2"><i class="bi bi-arrow-repeat animate-spin inline-block"></i> Uploading…</p>
    {% if thumbnail_error %}<p class="text-red-400 text-sm mt-2">{{ thumbnail_error }}</p>{% endif %}
</section>
