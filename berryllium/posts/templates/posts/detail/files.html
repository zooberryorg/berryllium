<ul class="divide-y divide-white/5 overflow-hidden rounded-xl border border-white/10">
    {% for file in files %}
        <li class="flex items-start sm:items-center gap-3 px-4 py-3">
            <span class="w-9 h-9 shrink-0 rounded-lg bg-gold-400/10 text-gold-300 flex items-center justify-center">
                <i class="bi {% if file.filename|lower|slice:'-4:' == '.pdf' %}bi-file-earmark-pdf{% else %}bi-file-earmark-zip{% endif %}"></i>
            </span>
            <div class="min-w-0 flex-1">
                <p class="text-white break-words">{{ file.title|default:file.filename }}</p>
                <p class="text-xs text-gray-400 break-words">
                    {% if file.title %}{{ file.filename }} · {% endif %}{{ file.size|filesizeformat }} · {{ file.download_count }} download{{ file.download_count|pluralize }}
                </p>
            </div>
            <a href="{% url 'post_file_download' file.pk %}" class="shrink-0 inline-flex items-center gap-1.5 rounded-full border border-gold-400/50 px-3.5 py-1.5 text-sm font-medium text-gold-200 hover:bg-gold-400 hover:text-pine-500 transition-colors duration-150 focus-visible:outline-2 focus-visible:outline-gold-400 focus-visible:outline-offset-2" aria-label="Download {{ file.title|default:file.filename }}">
                <i class="bi bi-download"></i><span class="hidden sm:inline">Download</span>
            </a>
        </li>
    {% endfor %}
</ul>
