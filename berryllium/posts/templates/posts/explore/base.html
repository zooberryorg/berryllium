{% extends 'shared/explore/base.html' %}
{% block explore_content %}
    <form id="explore-filters"
          hx-get="{{ request.path }}"
          hx-target="#post-results"
          hx-trigger="input changed delay:300ms from:#explore-search, change"
          hx-push-url="true"
          class="flex flex-col sm:flex-row sm:items-center gap-3 mb-6">
        <div class="relative flex-1">
            <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none"></i>
            <input type="search" id="explore-search" name="q" value="{{ q }}" placeholder="Search {% if kind == 'news' %}news{% else %}tutorials{% endif %}..."
                   class="zb-input w-full pl-11" aria-label="Search {{ kind_label|lower }}">
        </div>
        {% if tag %}<input type="hidden" name="tag" value="{{ tag }}">{% endif %}
        <label class="flex items-center gap-2 text-sm text-gray-400">
            <span class="whitespace-nowrap">Sort by</span>
            <select name="sort" class="zb-input text-sm py-2">
                {% for value, label in sort_options %}<option value="{{ value }}" {% if value == sort %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </label>
    </form>
    <div id="post-results">{% include 'posts/explore/results.html' %}</div>
{% endblock %}
