{% if links %}
    <ul class="flex flex-wrap gap-2">
        {% for link in links %}
            <li>
                <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer nofollow"
                   class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-sm text-white/90 hover:border-gold-400/50 hover:text-gold-300 transition-colors">
                    <i class="bi {{ link.icon }}"></i> {{ link.display_label }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endif %}
