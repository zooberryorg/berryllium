<div class="mb-2"
     x-data="rowTable(JSON.parse($el.dataset.config))"
     data-config="{{ config }}">
    <input type="hidden" name="{{ field.html_name }}" :value="serialized()">

    <div class="transition-all duration-200 space-y-3"
         :class="dragging ? 'bg-pine-special-100/10 border-2 border-dashed border-gold-400 rounded-xl px-2 py-2' : 'border-transparent'"
         {% if sortable %}{% include "shared/widgets/sort_config.html" %}{% endif %}>
        <template x-for="row in rows" :key="rowKey(row)">
            <div class="flex items-start gap-3 w-full bg-pine-draggable-200 rounded-lg px-2 py-2 text-sm text-granite-200 border-1 border-pine-draggable-100 hover:brightness-110 shadow-md hover:shadow-lg group/file"
                 {% if sortable %}x-sort:item="row.uid"{% endif %}>
                {% if sortable %}
                    <span class="text-pine-600 px-2 py-1 cursor-grab" x-sort:handle>
                        <i class="bi bi-grip-vertical group-hover/file:text-gold-400 text-lg"></i>
                    </span>
                {% endif %}

                <!-- columns side by side on wider screens, stacked on phones -->
                <div class="flex flex-col sm:flex-row gap-1 sm:gap-3 w-full min-w-0">
                {% if layout == "attribution" %}
                    <div class="flex flex-col w-full min-w-0">
                        <input type="text" maxlength="200" placeholder="Title *  (e.g. Ford F-150 model)" data-first-input x-sort:ignore
                               class="px-2 py-1 bg-transparent border-none focus:outline-none w-full rounded-xl transition-all duration-200 hover:text-white focus:text-white text-white"
                               x-model="row.title" @keydown.enter.prevent="$el.blur()">
                        <input type="text" maxlength="300" placeholder="Original author(s) *" x-sort:ignore
                               class="px-2 py-1 bg-transparent border-none focus:outline-none w-full rounded-xl transition-all duration-200 hover:text-white focus:text-white"
                               x-model="row.authors" @keydown.enter.prevent="$el.blur()">
                        <input type="url" maxlength="500" placeholder="Link (optional)" x-sort:ignore
                               class="px-2 py-1 bg-transparent border-none focus:outline-none w-full rounded-xl transition-all duration-200 hover:text-white focus:text-white text-white/60"
                               x-model="row.url" @keydown.enter.prevent="$el.blur()">
                    </div>
                    <div class="flex flex-col w-full min-w-0" x-data="textFieldExpand({})">
                        <textarea maxlength="500" placeholder="Note (optional)" x-sort:ignore
                                  class="px-2 py-1 text-sm text-white/50 focus:outline-none w-full rounded-xl hover:text-white focus:text-white transition-all duration-200 resize-none"
                                  :rows="focused ? 4 : 1"
                                  :class="focused ? 'h-15' : 'h-11'"
                                  x-model="row.note"
                                  @focus="expand()" @blur="collapse()" @keydown.escape="$el.blur()"></textarea>
                    </div>
                {% elif layout == "link" %}
                    <div class="flex items-center gap-2 shrink-0 px-2 py-1">
                        <i class="bi text-lg text-gold-300 w-5 text-center" :class="presetIcon(row.kind)"></i>
                        <select x-sort:ignore x-model="row.kind"
                                class="bg-transparent border-none focus:outline-none rounded-xl text-sm text-granite-200 hover:text-white focus:text-white cursor-pointer">
                            <template x-for="(preset, key) in presets" :key="key">
                                <option :value="key" x-text="preset.label" :selected="key === row.kind" class="bg-pine-700"></option>
                            </template>
                        </select>
                    </div>
                    <div class="flex flex-col w-full min-w-0">
                        <input type="url" maxlength="500" placeholder="https://... *" data-first-input x-sort:ignore
                               class="px-2 py-1 bg-transparent border-none focus:outline-none w-full rounded-xl transition-all duration-200 hover:text-white focus:text-white text-white"
                               x-model="row.url" @change="guessPreset(row)" @keydown.enter.prevent="$el.blur()">
                        <input type="text" maxlength="100" placeholder="Label (optional)" x-sort:ignore
                               class="px-2 py-1 bg-transparent border-none focus:outline-none w-full rounded-xl transition-all duration-200 hover:text-white focus:text-white text-white/60"
                               x-model="row.label" @keydown.enter.prevent="$el.blur()">
                    </div>
                {% endif %}
                </div>

                <button type="button" class="zb-action-delete flex p-2 mr-2 sm:opacity-0 sm:group-hover/file:opacity-100 transition-opacity" x-sort:ignore
                        @click="remove(row.uid)" aria-label="Remove row">
                    <ion-icon name="trash"></ion-icon>
                </button>
            </div>
        </template>
        <p class="text-sm text-white/40 px-1" x-show="!rows.length" x-text="emptyText"></p>
    </div>

    <div class="flex justify-end w-full mt-3">
        <button type="button" class="zb-action flex items-center justify-center" @click="add()" :disabled="rows.length >= maxRows">
            <ion-icon name="add-circle" class="pr-2"></ion-icon> <span x-text="addLabel"></span>
        </button>
    </div>

    {% for error in field.errors %}<p class="text-red-400 text-sm mt-1">{{ error }}</p>{% endfor %}
</div>
