<div x-data="markdownEditor($el.dataset)"
     data-upload-url="{{ upload_url }}"
     data-preview-url="{{ preview_url }}"
     class="flex flex-col gap-3 {{ editor_class|default:'' }}">
    <!-- toolbar -->
    <div class="flex flex-wrap items-center gap-2">
        <button type="button"
                class="zb-action rounded-xl"
                @click="togglePreview()">
            <ion-icon :name="showPreview ? 'eye-off' : 'eye'" class="text-sm text-granite-100"></ion-icon>
            <span class="text-sm" x-text="showPreview ? 'Hide Preview' : 'Show Preview'"></span>
        </button>
        <span class="w-px h-6 bg-white/10 mx-1"></span>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Bold (Ctrl+B)" :disabled="showPreview" @click="wrap('**', '**', 'bold text')"><i class="bi bi-type-bold"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Italic (Ctrl+I)" :disabled="showPreview" @click="wrap('*', '*', 'italic text')"><i class="bi bi-type-italic"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Heading" :disabled="showPreview" @click="prefixLines('## ')"><i class="bi bi-type-h2"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Link (Ctrl+K)" :disabled="showPreview" @click="link()"><i class="bi bi-link-45deg"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Bulleted list" :disabled="showPreview" @click="prefixLines('- ')"><i class="bi bi-list-ul"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Numbered list" :disabled="showPreview" @click="prefixLines('1. ')"><i class="bi bi-list-ol"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Quote" :disabled="showPreview" @click="prefixLines('> ')"><i class="bi bi-quote"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Inline code" :disabled="showPreview" @click="wrap('`', '`', 'code')"><i class="bi bi-code"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Code block" :disabled="showPreview" @click="codeBlock()"><i class="bi bi-code-square"></i></button>
        <button type="button" class="zb-action rounded-xl disabled:opacity-40" title="Insert image at cursor" :disabled="showPreview || uploading" @click="pickImage()">
            <i class="bi bi-image" x-show="!uploading"></i>
            <ion-icon name="sync" class="animate-spin" x-show="uploading" x-cloak></ion-icon>
        </button>
        <input type="file"
               x-ref="imageInput"
               class="hidden"
               accept=".jpg,.jpeg,.png,.webp,.gif"
               @change="uploadImage($event)">
    </div>
    <p class="text-red-400 text-sm" x-show="uploadError" x-text="uploadError" x-cloak></p>
    <!-- editor -->
    <div x-ref="editor"
         x-show="!showPreview"
         @keydown.ctrl.b.prevent="wrap('**', '**', 'bold text')"
         @keydown.meta.b.prevent="wrap('**', '**', 'bold text')"
         @keydown.ctrl.i.prevent="wrap('*', '*', 'italic text')"
         @keydown.meta.i.prevent="wrap('*', '*', 'italic text')"
         @keydown.ctrl.k.prevent="link()"
         @keydown.meta.k.prevent="link()">
        {{ field }}
        {% if field.errors %}
            <p class="text-red-400 text-sm mt-2">{{ field.errors.0 }}</p>
        {% endif %}
    </div>
    <!-- sanitized preview -->
    <div x-show="showPreview"
         x-cloak
         class="bg-pine-800/40 border border-white/10 rounded-xl p-4 min-h-40">
        <div x-ref="preview" class="md-preview text-granite-200 text-sm"></div>
    </div>
</div>
