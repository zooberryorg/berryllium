{# searches db and returns results as a row of data #}
<div class="mb-4"
     x-data="detailPicker(JSON.parse($el.dataset.config))"
     data-config="{{ config }}">
    <label class="block text-sm font-medium mb-1 text-white">{{ field.label }}</label>
    {% if field.help_text %}<p class="text-white/50 text-xs mb-2">{{ field.help_text }}</p>{% endif %}

    <input type="hidden" name="{{ field.html_name }}" :value="serialized()">

    <div class="space-y-2">
        <template x-for="row in items" :key="row.uid">
            <div class="rounded-xl border border-white/10 bg-pine-800/40 p-3 space-y-2">
                <!-- the header has the database item, or manual title + link -->
                <div class="flex items-start gap-3">
                    <template x-if="row.kind !== 'external'">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-white font-medium truncate" x-text="row.label"></span>
                                <a x-show="row.url" :href="row.url" target="_blank" rel="noopener noreferrer"
                                   class="text-gold-300 hover:text-gold-200 text-xs shrink-0" title="Read more">
                                    <i class="bi bi-box-arrow-up-right"></i>
                                </a>
                            </div>
                            <span class="text-xs text-white/50" x-show="row.sublabel" x-text="row.sublabel"></span>
                        </div>
                    </template>
                    <template x-if="row.kind === 'external'">
                        <div class="flex-1 grid gap-2 sm:grid-cols-2">
                            <input type="text" class="zb-input text-sm" placeholder="Title *" maxlength="200"
                                   x-model="row.title" data-external-title>
                            <input type="url" class="zb-input text-sm" placeholder="https://... *" maxlength="500"
                                   x-model="row.url">
                        </div>
                    </template>
                    <span class="shrink-0 text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full"
                          :class="row.kind === 'external' ? 'bg-white/10 text-white/60' : 'bg-gold-400/15 text-gold-300'"
                          x-show="insertKind || row.kind === 'external'"
                          x-text="row.kind === 'external' ? 'External' : 'On site'"></span>
                    <button type="button" class="text-white/50 hover:text-red-400 cursor-pointer shrink-0"
                            @click="removeRow(row.uid)" :aria-label="'Remove ' + (row.label || row.title || 'row')">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <!-- details -->
                <div class="grid gap-2" :class="showVersion ? 'sm:grid-cols-[1fr_10rem]' : ''">
                    <input type="text" class="zb-input text-sm" maxlength="500"
                           :placeholder="contextLabel + (contextPlaceholder ? ' — ' + contextPlaceholder : '')"
                           x-model="row.context">
                    <input type="text" class="zb-input text-sm" maxlength="100" placeholder="Version (optional)"
                           x-show="showVersion" x-model="row.version">
                </div>
            </div>
        </template>
        <p class="text-sm text-white/40 px-1" x-show="!items.length">Nothing added yet.</p>
    </div>

    <div class="flex flex-wrap gap-2 mt-2">
        <button type="button" class="zb-action rounded-xl" @click="openPicker()">
            <i class="bi bi-search"></i> <span x-text="title"></span>
        </button>
        <button type="button" class="zb-action rounded-xl" x-show="allowExternal" @click="addExternal()">
            <i class="bi bi-plus-lg"></i> <span x-text="externalLabel"></span>
        </button>
    </div>

    {% for error in field.errors %}<p class="text-red-400 text-sm mt-1">{{ error }}</p>{% endfor %}

    {% include "shared/widgets/search_dialog.html" %}
</div>
