{# Styles for dragged rows #}
<style>
    [x-cloak] { display: none !important; }
    .file-draggable.file-draggable { opacity: 1.0 !important; pointer-events: none; }
    .file-chosen { opacity: 0.0 !important; filter: brightness(1.5) !important; }
    .file-ghost { opacity: 0.0 !important; pointer-events: none; }
    body.sorting { user-select: none; -webkit-user-select: none; }
</style>
