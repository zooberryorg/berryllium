{% load bfilters %}
<div class="relative"
     x-data="{ open: false }"
     @mouseenter="open = true"
     @mouseleave="open = false">
    <a @click.prevent="open = !open"
       class="flex items-center space-x-2 bg-gradient-to-r from-gold-500 to-gold-300 text-pine-500 pl-4 pr-5 py-2.5 rounded-full hover:shadow-lg hover:shadow-pine-900/50 transition-all duration-300 cursor-pointer font-medium">
        <ion-icon name="add-outline" class="text-lg"></ion-icon>
        <span>New</span>
    </a>
    <div x-show="open"
         @click.outside="open = false"
         x-transition
         class="absolute pt-2 z-50 right-0">
        <div class="rounded-2xl border border-pine-300 bg-pine-700 p-2 shadow-2xl shadow-black/40 min-w-[280px]">
            <a @click="$dispatch('open-modal', { 
                    endpoint: '{% url 'mod_create_draft' %}', 
                    modalTitle: 'Create Mod Draft', 
                    icon: 'extension-puzzle',
                    maxWidth: 'max-w-2xl',
                    focusAfterRender: document.getElementById('upload-frame'),
                })"
               class="group/item flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 focus-visible:bg-white/5 focus-visible:outline-none transition-[color,background-color] duration-150 cursor-pointer">
                <span class="w-10 h-10 shrink-0 rounded-lg bg-gold-400/10 flex items-center justify-center text-gold-300 group-hover/item:bg-gold-400/20 transition-colors duration-150"><i class="bi bi-upload"></i></span>
                <span class="font-medium text-white group-hover/item:text-gold-200 transition-colors duration-150">Mod Page</span>
            </a>
            <a href="#"
               class="group/item flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 focus-visible:bg-white/5 focus-visible:outline-none transition-[color,background-color] duration-150 cursor-pointer">
                <span class="w-10 h-10 shrink-0 rounded-lg bg-gold-400/10 flex items-center justify-center text-gold-300 group-hover/item:bg-gold-400/20 transition-colors duration-150"><i class="bi bi-journal-text"></i></span>
                <span class="font-medium text-white group-hover/item:text-gold-200 transition-colors duration-150">New Dev Diary</span>
            </a>
            {% with post_noun=user|is_moderator|yesno:"Article,Tutorial" %}
            <a @click="$dispatch('open-modal', {
                    endpoint: '{% url 'post_create_draft' %}',
                    modalTitle: 'New {{ post_noun }}',
                    icon: 'document-text',
                    maxWidth: 'max-w-2xl',
                })"
               class="group/item flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 focus-visible:bg-white/5 focus-visible:outline-none transition-[color,background-color] duration-150 cursor-pointer">
                <span class="w-10 h-10 shrink-0 rounded-lg bg-gold-400/10 flex items-center justify-center text-gold-300 group-hover/item:bg-gold-400/20 transition-colors duration-150"><i class="bi {% if post_noun == 'Post' %}bi-newspaper{% else %}bi-tools{% endif %}"></i></span>
                <span class="font-medium text-white group-hover/item:text-gold-200 transition-colors duration-150">{{ post_noun }}</span>
            </a>
            {% endwith %}
            <a href="#"
               class="group/item flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 focus-visible:bg-white/5 focus-visible:outline-none transition-[color,background-color] duration-150 cursor-pointer">
                <span class="w-10 h-10 shrink-0 rounded-lg bg-gold-400/10 flex items-center justify-center text-gold-300 group-hover/item:bg-gold-400/20 transition-colors duration-150"><i class="bi bi-people-fill"></i></span>
                <span class="font-medium text-white group-hover/item:text-gold-200 transition-colors duration-150">Organization</span>
            </a>
        </div>
    </div>
</div>
