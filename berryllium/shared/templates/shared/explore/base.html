{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="max-w-screen-xl mx-auto px-2 sm:px-4 py-6 lg:py-8 animate-fade-in">
        <nav class="mb-6 lg:mb-8 overflow-x-auto" aria-label="Explore sections">
            <div class="inline-flex rounded-2xl bg-pine-600 backdrop-blur-sm p-1.5 border border-pine-300 min-w-max gap-1">
                {% url 'explore_mods' as mods_url %}
                <a href="{{ mods_url }}"
                   class="px-5 py-2.5 text-sm rounded-xl whitespace-nowrap flex items-center gap-2 transition-all duration-200 {% if explore_tab == 'mods' %}bg-gradient-to-r from-gold-500 to-gold-400 text-pine-500 font-semibold shadow-lg{% else %}text-gray-400 hover:text-white hover:bg-[#4a5a4b]/50 font-medium{% endif %}"
                   {% if explore_tab == 'mods' %}aria-current="page"{% endif %}>
                    <i class="bi bi-puzzle-fill"></i> Mods
                </a>
                <span class="px-5 py-2.5 text-sm rounded-xl whitespace-nowrap flex items-center gap-2 text-gray-500 cursor-not-allowed" title="Coming soon">
                    <i class="bi bi-grid-3x3-gap-fill"></i> Zoos & Saves
                </span>
                <span class="px-5 py-2.5 text-sm rounded-xl whitespace-nowrap flex items-center gap-2 text-gray-500 cursor-not-allowed" title="Coming soon">
                    <i class="bi bi-tools"></i> Tutorials
                </span>
                <span class="px-5 py-2.5 text-sm rounded-xl whitespace-nowrap flex items-center gap-2 text-gray-500 cursor-not-allowed" title="Coming soon">
                    <i class="bi bi-newspaper"></i> News
                </span>
                <span class="px-5 py-2.5 text-sm rounded-xl whitespace-nowrap flex items-center gap-2 text-gray-500 cursor-not-allowed" title="Coming soon">
                    <i class="bi bi-people-fill"></i> Modders
                </span>
            </div>
        </nav>
        {% block explore_content %}{% endblock %}
    </div>
{% endblock %}
