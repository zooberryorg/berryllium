{% load bfilters %}
<a href="{% url 'notification_open' item.pk %}"
   class="group/item flex items-start gap-3 rounded-xl px-3 py-2.5 transition-colors duration-150 hover:bg-white/5 focus-visible:bg-white/5 focus-visible:outline-none {% if item.is_unread %}bg-gold-400/5{% endif %}">
    <span class="w-9 h-9 shrink-0 rounded-lg flex items-center justify-center {% if item.is_unread %}bg-gold-400/15 text-gold-300{% else %}bg-white/5 text-gray-400{% endif %}">
        <i class="bi {{ item.icon }}"></i>
    </span>
    <span class="min-w-0 flex-1">
        <span class="block text-sm leading-snug {% if item.is_unread %}text-white{% else %}text-gray-300{% endif %} group-hover/item:text-gold-200">{{ item.text }}</span>
        <time class="block text-xs text-gray-400 mt-0.5" datetime="{{ item.created_at|date:'c' }}" title="{{ item.created_at|date:date_prefs.datetime }}">{{ item.created_at|timeago }}</time>
    </span>
    {% if item.is_unread %}<span class="mt-2 w-2 h-2 shrink-0 rounded-full bg-gold-400" aria-label="Unread"></span>{% endif %}
</a>
