<span id="notification-badge"
      {% if oob %}hx-swap-oob="true"{% endif %}
      hx-get="{% url 'notifications_badge' %}"
      hx-trigger="every 30s [document.visibilityState === 'visible'], visibilitychange[document.visibilityState === 'visible'] from:document"
      hx-swap="outerHTML"
      class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-gold-400 text-pine-600 text-[11px] font-bold items-center justify-center tabular-nums ring-2 ring-pine-800 {% if unread_notifications %}flex{% else %}hidden{% endif %}">
    {% if unread_notifications %}{% if unread_notifications > 99 %}99+{% else %}{{ unread_notifications }}{% endif %}<span class="sr-only"> unread</span>{% endif %}
</span>
