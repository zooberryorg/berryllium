<div class="relative"
     x-data="{ open: false, count: {{ unread_notifications|default:0 }} }"
     x-on:notifications-count.camel.window="if (open && $event.detail.value > count) htmx.ajax('GET', '{% url 'notifications_menu' %}', { target: '#notification-menu', swap: 'innerHTML' }); count = $event.detail.value"
     @click.outside="open = false"
     @keydown.escape.window="open = false">
    <button type="button"
            class="relative w-11 h-11 rounded-full flex items-center justify-center text-gray-200 bg-[#4a5a4b]/50 hover:bg-[#5a6a5b]/50 hover:text-white border border-[#5a6a5b]/50 transition-colors cursor-pointer focus-visible:outline-2 focus-visible:outline-gold-400 focus-visible:outline-offset-2"
            aria-label="Notifications"
            aria-haspopup="true"
            :aria-expanded="open.toString()"
            @click="open = !open; if (open) htmx.ajax('GET', '{% url 'notifications_menu' %}', { target: '#notification-menu', swap: 'innerHTML' })">
        <i class="bi bi-bell-fill"></i>
        {% include 'notifications/badge.html' %}
    </button>
    <div x-show="open" x-cloak x-transition.origin.top.right class="absolute right-0 pt-2 z-50">
        <div id="notification-menu" class="w-[22rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-pine-300 bg-pine-700 p-2 shadow-2xl shadow-black/40">
            <p class="px-3 py-6 text-center text-sm text-gray-400"><i class="bi bi-arrow-repeat animate-spin inline-block"></i> Loading…</p>
        </div>
    </div>
</div>
