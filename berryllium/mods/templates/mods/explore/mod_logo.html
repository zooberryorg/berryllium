<div class="{{ logo_class|default:'w-14 h-14 rounded-xl' }} shrink-0 overflow-hidden bg-pine-800 ring-1 ring-white/10">
    {% if mod.logo %}
        <img src="{{ mod.logo.url }}" alt="" loading="lazy" class="w-full h-full object-cover">
    {% else %}
        <span class="w-full h-full flex items-center justify-center text-white/30"><i class="bi bi-puzzle text-xl"></i></span>
    {% endif %}
</div>
