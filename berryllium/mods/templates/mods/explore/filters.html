<div class="flex flex-col sm:flex-row sm:items-center gap-3 text-sm">
    <div class="grid grid-cols-1 sm:flex sm:flex-wrap gap-3 flex-1">
        <label class="relative group">
            <span class="sr-only">Sort by</span>
            <select name="sort" class="zb-input w-full sm:w-auto pr-10 cursor-pointer sm:min-w-[200px] bg-pine-700 hover:bg-pine-700/50 transition-all duration-200 appearance-none text-pine-100/80">
                {% for key, label in sort_options %}
                    <option value="{{ key }}" {% if filters.sort == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <i class="bi bi-chevron-down pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 group-hover:text-white transition-colors"></i>
        </label>
        <label class="relative group">
            <span class="sr-only">Game</span>
            <select name="game" class="zb-input w-full sm:w-auto pr-10 cursor-pointer sm:min-w-[180px] bg-pine-700 hover:bg-pine-700/50 transition-all duration-200 appearance-none text-pine-100/80">
                <option value="">Any game</option>
                {% for key, label in game_options %}
                    <option value="{{ key }}" {% if filters.game == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <i class="bi bi-chevron-down pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 group-hover:text-white transition-colors"></i>
        </label>
        <label class="relative group">
            <span class="sr-only">Published</span>
            <select name="period" class="zb-input w-full sm:w-auto pr-10 cursor-pointer sm:min-w-[160px] bg-pine-700 hover:bg-pine-700/50 transition-all duration-200 appearance-none text-pine-100/80">
                <option value="">All time</option>
                {% for key, label in period_options %}
                    <option value="{{ key }}" {% if filters.period == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <i class="bi bi-chevron-down pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 group-hover:text-white transition-colors"></i>
        </label>
    </div>

    {# view toggle #}
    <div class="flex items-center gap-2 self-end sm:self-auto" role="group" aria-label="Layout">
        <button type="button"
                class="w-10 h-10 rounded-lg flex items-center justify-center transition-all duration-200 cursor-pointer"
                :class="view === 'grid' ? 'bg-gold-400 text-pine-500' : 'bg-[#4a5a4b]/50 text-gray-400 hover:text-white'"
                :aria-pressed="view === 'grid'"
                aria-label="Grid view"
                @click="setView('grid')">
            <i class="bi bi-grid-3x3-gap-fill"></i>
        </button>
        <button type="button"
                class="w-10 h-10 rounded-lg flex items-center justify-center transition-all duration-200 cursor-pointer"
                :class="view === 'list' ? 'bg-gold-400 text-pine-500' : 'bg-[#4a5a4b]/50 text-gray-400 hover:text-white'"
                :aria-pressed="view === 'list'"
                aria-label="List view"
                @click="setView('list')">
            <i class="bi bi-list-ul"></i>
        </button>
    </div>
</div>
