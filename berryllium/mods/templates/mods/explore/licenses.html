<fieldset class="rounded-2xl bg-pine-600 backdrop-blur-sm p-1.5 border border-pine-300">
    <legend class="sr-only">License</legend>
    <h3 class="text-lg font-bold text-white px-4 pt-2 mb-3">License</h3>
    <div class="space-y-1 text-sm">
        <label class="explore-option group flex items-center gap-3 px-4 py-1 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-[color,background-color] duration-150 cursor-pointer">
            <input type="radio" name="license" value="" class="sr-only" {% if not filters.license %}checked{% endif %}>
           <span class="w-8 h-8 rounded-lg flex items-center justify-center">
                <i class="explore-option-icon bi bi-shield text-gray-400 text-sm group-hover:text-gold-300 transition-colors duration-150"></i>
            </span>
            <span class="flex-1">Any license</span>
        </label>
        {% for license in licenses %}
            <label class="explore-option group flex items-center gap-3 px-4 py-1 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 border border-transparent transition-[color,background-color] duration-150 cursor-pointer"
                   title="{{ license.title }}">
                <input type="radio" name="license" value="{{ license.key }}" class="sr-only" {% if filters.license == license.key %}checked{% endif %}>
                <span class="w-8 h-8 rounded-lg flex items-center justify-center">
                    <i class="explore-option-icon bi bi-shield-check text-gray-400 text-sm group-hover:text-gold-300 transition-colors duration-150"></i>
                </span>
                <span class="flex-1 min-w-0 truncate">{{ license.label }}</span>
                <span class="text-xs bg-pine-700/50 px-2 py-1 rounded-full">{{ license.count }}</span>
            </label>
        {% empty %}
            <p class="text-sm text-white/40 px-4 pb-2">No licenses yet.</p>
        {% endfor %}
    </div>
</fieldset>
