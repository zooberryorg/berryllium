<button type="button"
    class="zb-action-delete flex p-2 mr-2 sm:opacity-0 sm:group-hover/file:opacity-100 transition-opacity"
    x-sort:ignore
    {# djlint:off #}
        @click="() => { 
            keepFile = false; 
            htmx.ajax('POST', '{% url 'remove_temp_file' file.instance.id %}', {
                headers: {'X-CSRFToken': '{{ csrf_token }}'},
                values: { file_id: {{ file.instance.id }} },
                onAfterSwap: () => {
                    $dispatch('files-state-changed');
                }
            });
    }"{# djlint:on #}>
    <ion-icon name="trash"></ion-icon>
</button>
