<label class="inline-flex cursor-pointer pl-4 py-1 pr-4 max-w-max bg-pine-special-200 border border-pine-special-100 rounded-full shadow-xs mb-4 mt-6 items-center hover:brightness-110 transition-all transition-duration-300">
    <input type="checkbox"
           id="group_manager_toggle"
           class="sr-only peer"
           {# djlint:off #}
           {% if mod.use_file_groups and existing_files %}
               {# on, with files: ask first #}
               checked
               @click.prevent="$dispatch('open-modal', {
                   endpoint: '{% url 'hx_file_manager_disable_confirm' mod_id=mod.id %}',
                   modalTitle: 'Turn off file manager?',
                   icon: 'warning',
                   maxWidth: 'max-w-md',
                   hideHeader: true,
               })"
           {% elif mod.use_file_groups %}
               {# on, no files yet: nothing to lose, turn off directly #}
               checked
               hx-post="{% url 'hx_toggle_file_manager' mod_id=mod.id %}"
               hx-vals='{"enabled": "false"}'
               hx-trigger="change"
               hx-target="#upload-frame"
               hx-swap="innerHTML"
           {% else %}
               {# off: turn on directly #}
               hx-post="{% url 'hx_toggle_file_manager' mod_id=mod.id %}"
               hx-vals='{"enabled": "true"}'
               hx-trigger="change"
               hx-target="#upload-frame"
               hx-swap="innerHTML"
           {% endif %}
           {# djlint:on #}>
    <div class="
        shrink-0 relative peer w-9 h-5 rounded-full
        bg-pine-400/30 after:bg-pine-info-200 peer-checked:bg-gold-400
        peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full 
        peer-checked:after:border-buffer after:content-[''] after:scale-100 peer-hover:after:scale-110 peer-active:after:scale-140 after:absolute 
        after:top-[2px] after:start-[2px]  after:rounded-full 
        after:h-4 after:w-4 after:transition-all">
    </div>
    {# djlint:on #}
    <div class="ms-2.5 select-none text-white/80">
        <p class="text-xs text-heading mb-1 flex">Enable File Manager</p>
    </div>
</label>
